spring.application.name=backend
server.port=8080
# no default profile - `local`
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# Flyway owns the schema, not Hibernate, never let it auto-generate DDL.
# `validate` still checks your @Entity mappings against the real schema at startup
# A mismatch fails loudly instead of surfacing as a runtime bug.
spring.jpa.hibernate.ddl-auto=validate
# Open Session In View is on by default in Spring Boot
# Keeps a DB connection held open for the entire request
# A well-known way to hide N+1 queries and exhaust the connection pool under load
#
# Off means any lazy-loading you didn't account for fails fast inside the service/transaction boundary,
# where it belongs, instead of silently working until it doesn't.
spring.jpa.open-in-view=false
