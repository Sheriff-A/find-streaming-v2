# Active when running the backend directly on the host (IDE / mvnw) against
# the Postgres container started by `docker compose up db`.
# Pulls DB_NAME/DB_USER/DB_PASSWORD from the repo-root .env - assumes the
# working directory is backend/ (the default for mvnw and most IDE run configs).
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
# Real schema + local-only seed data. Setting `locations` replaces the default
# (classpath:db/migration), so both need to be listed explicitly here.
spring.flyway.locations=classpath:db/migration,classpath:db/dev-seed
