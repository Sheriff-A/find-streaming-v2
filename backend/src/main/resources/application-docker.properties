# Active when the backend itself runs inside docker-compose.
# SPRING_DATASOURCE_* env vars are injected by docker-compose.yml, so nothing
# else is needed here - this file mainly documents the fact for readers.

spring.flyway.enabled=true
# Real schema + local-only seed data. Setting `locations` replaces the default
# (classpath:db/migration), so both need to be listed explicitly here.
spring.flyway.locations=classpath:db/migration,classpath:db/dev-seed
